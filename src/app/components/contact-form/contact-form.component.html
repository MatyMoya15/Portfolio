<div class="form-contact" id="contact">
    <div class="contact-container">

        <div class="contact-header">
            <h2>Contact <i class="fa-solid fa-paper-plane"></i></h2>
            <h3>Let's <span>connect!</span></h3>
            <p class="contact-sub">
                Reach me directly at
                <a class="mail" href="mailto:matymoyano4@gmail.com">matymoyano4&#64;gmail.com</a>
                <button type="button" class="copy-btn" (click)="copyToClipboard()">
                    <i [ngClass]="{'fa-regular fa-clone': !copied, 'fa-solid fa-check': copied}"></i>
                    {{ copied ? 'Copied' : 'Copy' }}
                </button>
            </p>
        </div>

        <div class="contact-divider">
            <span>or send me a message</span>
        </div>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="name">
                    <i class="fas fa-user"></i> Name
                </label>
                <input type="text" id="name" formControlName="name" placeholder="Your name" />
                <div *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.invalid" class="error-message">
                    Name is required.
                </div>
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-at"></i> Email
                </label>
                <input type="email" id="email" formControlName="email" placeholder="your@email.com" />
                <div *ngIf="contactForm.get('email')?.touched && contactForm.get('email')?.invalid" class="error-message">
                    <div *ngIf="contactForm.get('email')?.errors?.['required']">Email is required.</div>
                    <div *ngIf="contactForm.get('email')?.errors?.['emailInvalid']">Please enter a valid email address.</div>
                </div>
            </div>

            <div class="form-group">
                <label for="message">
                    <i class="fas fa-comment"></i> Message
                </label>
                <textarea id="message" formControlName="message" placeholder="What's on your mind?"></textarea>
                <div *ngIf="contactForm.get('message')?.touched && contactForm.get('message')?.invalid" class="error-message">
                    Message is required.
                </div>
            </div>

            <button class="send" type="submit">
                Send <i class="fa-solid fa-paper-plane"></i>
            </button>

        </form>

        <div *ngIf="showSuccessAlert" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span><strong>Success!</strong> Message sent successfully.</span>
            <button class="close" (click)="showSuccessAlert = false">&times;</button>
        </div>

        <div *ngIf="showErrorAlert" class="alert alert-danger">
            <i class="fa-solid fa-circle-xmark"></i>
            <span><strong>Error!</strong> Failed to send message, please try again.</span>
            <button class="close" (click)="showErrorAlert = false">&times;</button>
        </div>

    </div>
</div>
